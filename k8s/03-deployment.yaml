apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab
  namespace: kubelab
  labels: { app: kubelab }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: kubelab }
  template:
    metadata:
      labels: { app: kubelab }
    spec:
      containers:
        - name: kubelab
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/kubelab:latest # Adjust the image name and tag as needed
          
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: kubelab-config }
          env:
            - name: API_SECRET
              valueFrom: { secretKeyRef: { name: kubelab-secret, key: API_SECRET } }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
