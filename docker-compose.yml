services:
  app:                                   # scale it: docker compose up --build --scale app=3
    build: ./app
    image: kubelab:local
    environment:
      APP_ENV: docker-compose
      WELCOME_MESSAGE: "Hello from Docker Compose"
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  nginx:                                 # reverse proxy / load balancer (like a Kubernetes Service)
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app: { condition: service_healthy }
  test:                                  # docker compose --profile test run --rm test
    profiles: ["test"]
    build: { context: ./app, target: test }
